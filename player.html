<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCatalog Elo - Player de Vídeo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .error-message {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem;
            max-width: 500px;
            text-align: center;
        }

        .error-message.visible {
            display: flex;
        }

        .error-icon {
            font-size: 48px;
            color: #ef4444;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .error-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        .error-btn {
            margin-top: 1rem;
            padding: 0.75rem 2rem;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .error-btn:hover {
            background: #2563eb;
        }

        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 2rem 3rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 5;
        }

        .controls-overlay.visible {
            opacity: 1;
        }

        .controls-overlay:hover {
            opacity: 1;
        }

        .control-buttons {
            display: flex;
            gap: 1rem;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .control-btn.active {
            background: #3b82f6;
        }

        .fullscreen-btn {
            margin-left: auto;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn.visible {
            opacity: 1;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.8);
        }

        .title-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .title-overlay.visible {
            opacity: 1;
        }

        .title-overlay h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .title-overlay p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.25rem;
        }

        .timestamp {
            position: absolute;
            bottom: 4rem;
            right: 3rem;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 6;
        }

        .timestamp.visible {
            opacity: 1;
        }

        .keyboard-hint {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 6;
        }

        .keyboard-hint.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper">
            <iframe id="video-iframe" style="display: none;" allowfullscreen></iframe>
            <video id="video-element" style="display: none;"></video>
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loader">
            <div class="spinner"></div>
            <div class="loading-text">Carregando Vídeo</div>
        </div>
    </div>

    <div class="error-message" id="error-message">
        <i class="fas fa-exclamation-triangle error-icon"></i>
        <div class="error-title">Erro ao Carregar Vídeo</div>
        <div class="error-desc" id="error-desc">Não foi possível reproduzir este vídeo.</div>
        <button class="error-btn" onclick="closePlayer()">Fechar Player</button>
    </div>

    <div class="close-btn" id="close-btn" onclick="closePlayer()">
        <i class="fas fa-times"></i>
    </div>

    <div class="title-overlay" id="title-overlay">
        <h1 id="video-title">Título do Vídeo</h1>
        <p id="video-subtitle">Trailer Oficial</p>
    </div>

    <div class="timestamp" id="timestamp">00:00 / 00:00</div>

    <div class="controls-overlay" id="controls-overlay">
        <div class="control-buttons">
            <button class="control-btn" id="play-pause-btn" onclick="togglePlayPause()">
                <i class="fas fa-play" id="play-pause-icon"></i>
            </button>
            <button class="control-btn" onclick="restartVideo()">
                <i class="fas fa-undo"></i>
            </button>
            <button class="control-btn" id="fullscreen-btn" class="control-btn fullscreen-btn" onclick="toggleFullscreen()">
                <i class="fas fa-expand" id="fullscreen-icon"></i>
            </button>
        </div>
    </div>

    <div class="keyboard-hint" id="keyboard-hint">
        ESC - Fechar | F - Fullscreen | Space - Play/Pause | ← → - Retroceder/Avançar
    </div>

    <script src="../js/vendor/localforage.min.js"></script>
    <script>
        const PlayerEngine = {
            _iframe: null,
            _videoElement: null,
            _loadingOverlay: null,
            _errorMessage: null,
            _errorDesc: null,
            _closeBtn: null,
            _titleOverlay: null,
            _timestamp: null,
            _controlsOverlay: null,
            _playPauseBtn: null,
            _playPauseIcon: null,
            _fullscreenBtn: null,
            _fullscreenIcon: null,
            _keyboardHint: null,
            _currentUrl: null,
            _platform: null,
            _videoId: null,
            _isPlaying: false,
            _videoTitle: '',
            _isTrailer: false,

            init() {
                this._iframe = document.getElementById('video-iframe');
                this._videoElement = document.getElementById('video-element');
                this._loadingOverlay = document.getElementById('loading-overlay');
                this._errorMessage = document.getElementById('error-message');
                this._errorDesc = document.getElementById('error-desc');
                this._closeBtn = document.getElementById('close-btn');
                this._titleOverlay = document.getElementById('title-overlay');
                this._timestamp = document.getElementById('timestamp');
                this._controlsOverlay = document.getElementById('controls-overlay');
                this._playPauseBtn = document.getElementById('play-pause-btn');
                this._playPauseIcon = document.getElementById('play-pause-icon');
                this._fullscreenBtn = document.getElementById('fullscreen-btn');
                this._fullscreenIcon = document.getElementById('fullscreen-icon');
                this._keyboardHint = document.getElementById('keyboard-hint');

                this.setupEventListeners();
                this.loadFromURL();
            },

            loadFromURL() {
                const params = new URLSearchParams(window.location.search);
                const url = params.get('url');
                const title = params.get('title');
                const isTrailer = params.get('isTrailer');
                const forceFullscreen = params.get('forceFullscreen') === 'true';
                
                console.log('[DEBUG Player] loadFromURL chamado com:', { url, title, isTrailer, forceFullscreen });

                if (url) {
                    this._currentUrl = url;
                    this._videoTitle = title || 'Vídeo';
                    this._isTrailer = isTrailer === 'true';

                    if (title) {
                        this.setTitle(this._videoTitle, this._isTrailer ? 'Trailer Oficial' : '');
                    }

                    this.loadUrl(url, this._videoTitle, forceFullscreen);
                } else if (typeof electronAPI !== 'undefined' && electronAPI.initPlayer) {
                    electronAPI.initPlayer(this);

                    if (typeof electronAPI.setPlayerCallback === 'function') {
                        electronAPI.setPlayerCallback((payload) => {
                            this.loadUrl(payload.url, payload.title || this._videoTitle, payload.forceFullscreen !== false);
                        });
                    }
                }
            },

            setupEventListeners() {
                if (this._iframe) {
                    this._iframe.addEventListener('load', () => {
                        this._loadingOverlay.classList.add('hidden');
                        this._titleOverlay.classList.add('visible');
                        this._keyboardHint.classList.add('visible');
                        this.showControls();
                    });

                    this._iframe.addEventListener('error', () => {
                        this.showError('Não foi possível carregar o vídeo. Tente novamente.');
                    });
                }

                if (this._videoElement) {
                    this._videoElement.addEventListener('timeupdate', () => {
                        this.updateTimestamp();
                    });

                    this._videoElement.addEventListener('play', () => {
                        this._isPlaying = true;
                        this._playPauseIcon.classList.remove('fa-play');
                        this._playPauseIcon.classList.add('fa-pause');
                    });

                    this._videoElement.addEventListener('pause', () => {
                        this._isPlaying = false;
                        this._playPauseIcon.classList.remove('fa-pause');
                        this._playPauseIcon.classList.add('fa-play');
                    });

                    this._videoElement.addEventListener('loadedmetadata', () => {
                        this._loadingOverlay.classList.add('hidden');
                        this._titleOverlay.classList.add('visible');
                        this._keyboardHint.classList.add('visible');
                        this.showControls();
                    });

                    this._videoElement.addEventListener('error', () => {
                        this.showError('Não foi possível reproduzir este vídeo.');
                    });
                }

                document.addEventListener('fullscreenchange', () => {
                    this._fullscreenIcon.classList.remove('fa-expand', 'fa-compress');
                    this._fullscreenIcon.classList.add('fa-expand');
                    if (!document.fullscreenElement) {
                        this._controlsOverlay.classList.remove('visible');
                        this._closeBtn.classList.remove('visible');
                    } else {
                        this._fullscreenIcon.classList.remove('fa-expand');
                        this._fullscreenIcon.classList.add('fa-compress');
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closePlayer();
                    } else if (e.key === 'f' || e.key === 'F') {
                        toggleFullscreen();
                    } else if (e.key === ' ') {
                        e.preventDefault();
                        togglePlayPause();
                    } else if (e.key === 'ArrowLeft') {
                        restartVideo();
                    } else if (e.key === 'ArrowRight') {
                        this.seekForward();
                    }
                });

                this._controlsOverlay.addEventListener('click', () => {
                    this.showControls();
                });
            },

            showControls() {
                this._controlsOverlay.classList.add('visible');
                this._closeBtn.classList.add('visible');
                this._timestamp.classList.add('visible');

                clearTimeout(this._controlsTimeout);
                this._controlsTimeout = setTimeout(() => {
                    if (this._isPlaying) {
                        this._controlsOverlay.classList.remove('visible');
                        this._closeBtn.classList.remove('visible');
                        this._timestamp.classList.remove('visible');
                    }
                }, 3000);
            },

            updateTimestamp() {
                if (this._videoElement) {
                    const current = this._videoElement.currentTime;
                    const duration = this._videoElement.duration || 0;
                    const format = (t) => {
                        const mins = Math.floor(t / 60);
                        const secs = Math.floor(t % 60);
                        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    };
                    this._timestamp.textContent = `${format(current)} / ${format(duration)}`;
                }
            },

            loadUrl(url, title = 'Vídeo', forceFullscreen = true) {
                this._currentUrl = url;
                this._loadingOverlay.classList.remove('hidden');
                this._errorMessage.classList.remove('visible');

                if (title) {
                    this.setTitle(title, this._isTrailer ? 'Trailer Oficial' : '');
                }

                const platform = this.detectPlatform(url);

                if (platform === 'youtube') {
                    this._iframe.style.display = 'block';
                    this._videoElement.style.display = 'none';
                    this._iframe.src = this.getYouTubeEmbedUrl(url);
                    if (forceFullscreen) this.forceFullscreen();
                } else if (platform === 'vimeo') {
                    this._iframe.style.display = 'block';
                    this._videoElement.style.display = 'none';
                    this._iframe.src = url;
                    if (forceFullscreen) this.forceFullscreen();
                } else if (platform === 'direct') {
                    this._iframe.style.display = 'none';
                    this._videoElement.style.display = 'block';
                    this._videoElement.src = url;
                    if (forceFullscreen) this.forceFullscreen();
                } else {
                    this.showError('Plataforma de vídeo não suportada');
                }
            },

            forceFullscreen() {
                // Força tela cheia imediatamente após o carregamento
                if (document.documentElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log('Fullscreen não suportado ou já em fullscreen:', err);
                    });
                }
            },

            detectPlatform(url) {
                if (/youtube\.com\/watch\?v=/.test(url) || /youtu\.be\//.test(url)) {
                    return 'youtube';
                } else if (/vimeo\.com/.test(url)) {
                    return 'vimeo';
                } else if (url.match(/\.(mp4|webm|ogg|mov|avi|mkv|wmv)$/i)) {
                    return 'direct';
                }
                return 'unknown';
            },

            getYouTubeEmbedUrl(url) {
                const videoId = this.extractYouTubeId(url);
                if (!videoId) return url;
                return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
            },

            extractYouTubeId(url) {
                const patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/,
                    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
                    /youtube\.com\/v\/([a-zA-Z0-9_-]{11})/
                ];

                for (const pattern of patterns) {
                    const match = url.match(pattern);
                    if (match && match[1]) {
                        return match[1];
                    }
                }
                return null;
            },

            togglePlayPause() {
                if (this._videoElement && this._videoElement.style.display !== 'none') {
                    if (this._isPlaying) {
                        this._videoElement.pause();
                    } else {
                        this._videoElement.play();
                    }
                }
            },

            restartVideo() {
                if (this._videoElement && this._videoElement.style.display !== 'none') {
                    this._videoElement.currentTime = 0;
                    this._videoElement.play();
                }
            },

            seekForward() {
                if (this._videoElement && this._videoElement.style.display !== 'none') {
                    const currentTime = this._videoElement.currentTime;
                    this._videoElement.currentTime = Math.min(currentTime + 10, this._videoElement.duration);
                }
            },

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error('Erro ao entrar em fullscreen:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
            },

            showError(message) {
                this._loadingOverlay.classList.add('hidden');
                this._errorMessage.classList.add('visible');
                this._errorDesc.textContent = message;
            },

            setTitle(title, subtitle = '') {
                document.getElementById('video-title').textContent = title;
                const subtitleEl = document.getElementById('video-subtitle');
                if (subtitleEl) {
                    subtitleEl.textContent = subtitle;
                }
            },
        };

        function closePlayer() {
            if (typeof electronAPI !== 'undefined' && electronAPI.closePlayer) {
                electronAPI.closePlayer();
            } else {
                window.close();
            }
        }

        function togglePlayPause() {
            PlayerEngine.togglePlayPause();
        }

        function restartVideo() {
            PlayerEngine.restartVideo();
        }

        function toggleFullscreen() {
            PlayerEngine.toggleFullscreen();
        }

        let _controlsTimeout = null;

        document.addEventListener('click', () => {
            clearTimeout(_controlsTimeout);
            _controlsTimeout = setTimeout(() => {
                if (PlayerEngine._isPlaying) {
                    PlayerEngine._controlsOverlay.classList.remove('visible');
                    PlayerEngine._closeBtn.classList.remove('visible');
                    PlayerEngine._timestamp.classList.remove('visible');
                }
            }, 3000);
        });

        document.addEventListener('mousemove', () => {
            if (PlayerEngine._isPlaying) {
                PlayerEngine.showControls();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && PlayerEngine._iframe) {
                PlayerEngine._iframe.contentWindow.postMessage({ type: 'pause' }, '*');
            }
        });

        window.addEventListener('pagehide', () => {
            if (PlayerEngine._iframe) {
                PlayerEngine._iframe.src = '';
            }
            if (PlayerEngine._videoElement) {
                PlayerEngine._videoElement.pause();
                PlayerEngine._videoElement.src = '';
            }
        });

        window.addEventListener('beforeunload', () => {
            if (PlayerEngine._iframe) {
                PlayerEngine._iframe.src = '';
            }
            if (PlayerEngine._videoElement) {
                PlayerEngine._videoElement.pause();
                PlayerEngine._videoElement.src = '';
            }
        });

        PlayerEngine.init();

        // Força tela cheia ao iniciar o player (sempre fullscreen, independente da configuracao)
        setTimeout(() => {
            PlayerEngine.forceFullscreen();
        }, 500);

        if (typeof electronAPI !== 'undefined' && electronAPI.initPlayer) {
            electronAPI.initPlayer(PlayerEngine);
        }
    </script>
</body>
</html>
