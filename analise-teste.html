<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise Automática do Teste</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result-box { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border-left: 4px solid;
        }
        .success { 
            background: #e8f5e8; 
            border-left-color: #4caf50; 
        }
        .error { 
            background: #ffebee; 
            border-left-color: #f44336; 
        }
        .warning { 
            background: #fff3e0; 
            border-left-color: #ff9800; 
        }
        .btn { 
            padding: 10px 20px; 
            margin: 5px; 
            cursor: pointer; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            background: #f0f0f0;
        }
        .btn:hover { background: #e0e0e0; }
        .log { 
            background: #f9f9f9; 
            padding: 15px; 
            border-radius: 8px; 
            max-height: 400px; 
            overflow-y: auto; 
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔍 Análise Automática do Teste</h1>
    
    <div>
        <button class="btn" onclick="analyzeResults()">
            <i class="fas fa-search"></i> Analisar Resultados
        </button>
        
        <button class="btn" onclick="runFullAnalysis()">
            <i class="fas fa-play"></i> Executar Análise Completa
        </button>
        
        <button class="btn" onclick="clearResults()">
            <i class="fas fa-trash"></i> Limpar Resultados
        </button>
    </div>
    
    <div id="results"></div>
    
    <h3>📊 Relatório Detalhado</h3>
    <div id="detailed-report" class="log"></div>

    <script>
        function analyzeResults() {
            const results = document.getElementById('results');
            const report = document.getElementById('detailed-report');
            
            results.innerHTML = '';
            report.innerHTML = '';
            
            // Simula análise baseada nos testes típicos
            const testResults = {
                appPrincipal: checkAppPrincipal(),
                searchBar: checkSearchBar(),
                cadastro: checkCadastro(),
                binding: checkBinding(),
                pwa: checkPWA()
            };
            
            let successCount = 0;
            let errorCount = 0;
            let warningCount = 0;
            
            // Analisa resultados
            Object.entries(testResults).forEach(([test, result]) => {
                if (result.success) successCount++;
                if (result.error) errorCount++;
                if (result.warning) warningCount++;
                
                const div = document.createElement('div');
                div.className = `result-box ${result.success ? 'success' : result.error ? 'error' : 'warning'}`;
                div.innerHTML = `
                    <h3>${result.title}</h3>
                    <p>${result.message}</p>
                    <small>Detalhes: ${result.details}</small>
                `;
                results.appendChild(div);
                
                // Adiciona ao relatório detalhado
                report.innerHTML += `[${new Date().toLocaleTimeString()}] ${result.title}: ${result.status}\n`;
                report.innerHTML += `  → ${result.details}\n\n`;
            });
            
            // Resumo geral
            const summary = document.createElement('div');
            summary.className = `result-box ${errorCount === 0 ? 'success' : 'error'}`;
            summary.innerHTML = `
                <h3>📊 Resumo Geral</h3>
                <p>Sucessos: ${successCount} | Erros: ${errorCount} | Avisos: ${warningCount}</p>
                <p>Status: ${errorCount === 0 ? '✅ PRONTO PARA FECHAR .EXE' : '❌ PRECISA CORRIGIR ANTES'}</p>
            `;
            results.insertBefore(summary, results.firstChild);
        }
        
        function checkAppPrincipal() {
            // Verifica se APP_STATE existe e foi limpo
            const hasAppState = typeof window.APP_STATE !== 'undefined';
            const isClean = !hasAppState || window.APP_STATE.movies.length === 0;
            
            return {
                title: '🧹 App Principal',
                success: hasAppState && isClean,
                error: !hasAppState,
                warning: hasAppState && !isClean,
                message: hasAppState && isClean ? 'Dados limpos e APP_STATE reiniciado' : 
                        !hasAppState ? 'APP_STATE não encontrado' : 'APP_STATE ainda tem dados',
                details: hasAppState ? `APP_STATE encontrado com ${window.APP_STATE.movies.length} filmes` : 'APP_STATE não definido',
                status: hasAppState && isClean ? 'OK' : !hasAppState ? 'ERRO' : 'AVISO'
            };
        }
        
        function checkSearchBar() {
            const searchBtn = document.querySelector('[data-onclick*="toggleSearchBar"]');
            const searchContainer = document.getElementById('search-bar-container');
            const searchInput = document.getElementById('main-search');
            
            return {
                title: '🔍 Barra de Pesquisa',
                success: searchBtn && searchContainer && searchInput,
                error: !searchBtn,
                warning: searchBtn && (!searchContainer || !searchInput),
                message: searchBtn && searchContainer && searchInput ? 'Todos elementos encontrados' : 
                        !searchBtn ? 'Botão de pesquisa não encontrado' : 'Elementos incompletos',
                details: searchBtn ? `Botão encontrado: ${!!searchBtn}` : 'Botão não encontrado',
                status: searchBtn && searchContainer && searchInput ? 'OK' : 'ERRO/AVISO'
            };
        }
        
        function checkCadastro() {
            const addBtn = document.querySelector('[data-onclick*="openModal"]');
            
            return {
                title: '📝 Cadastro',
                success: !!addBtn,
                error: !addBtn,
                warning: false,
                message: addBtn ? 'Botão de cadastro encontrado' : 'Botão de cadastro não encontrado',
                details: addBtn ? 'Botão de cadastro localizado' : 'Nenhum botão de cadastro encontrado',
                status: addBtn ? 'OK' : 'ERRO'
            };
        }
        
        function checkBinding() {
            const elements = document.querySelectorAll('[data-on*]');
            
            return {
                title: '🔗 Binding',
                success: elements.length === 0,
                error: elements.length > 0,
                warning: false,
                message: elements.length === 0 ? 'Todos elementos vinculados' : `${elements.length} elementos não vinculados`,
                details: `Elementos com data-on*: ${elements.length}`,
                status: elements.length === 0 ? 'OK' : 'ERRO'
            };
        }
        
        function checkPWA() {
            const hasManifest = typeof document.querySelector('link[rel="manifest"]') !== 'null';
            
            return {
                title: '📱 PWA',
                success: hasManifest,
                error: false,
                warning: !hasManifest,
                message: hasManifest ? 'Manifest PWA encontrado' : 'Manifest PWA não encontrado',
                details: hasManifest ? 'PWA configurado' : 'PWA incompleto',
                status: hasManifest ? 'OK' : 'AVISO'
            };
        }
        
        function runFullAnalysis() {
            // Executa a aplicação primeiro
            if (typeof window.APP_STATE !== 'undefined') {
                localStorage.clear();
                localforage.clear().then(() => {
                    window.APP_STATE.movies = [];
                    window.APP_STATE.currentView = 'filmes';
                    window.APP_STATE.activeFilter = 'all';
                    window.APP_STATE.searchQuery = '';
                    window.APP_STATE.searchTimer = null;
                    window.APP_STATE.selectedId = null;
                    window.APP_STATE._editingId = null;
                    
                    setTimeout(() => {
                        analyzeResults();
                    }, 1000);
                });
            } else {
                analyzeResults();
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('detailed-report').innerHTML = '';
        }
        
        // Auto-análise ao carregar
        window.addEventListener('load', () => {
            setTimeout(analyzeResults, 2000);
        });
    </script>
</body>
</html>
